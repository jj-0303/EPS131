name: Ridgecrest 3D tomography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy requests
      - run: python pipeline/build_3d.py --download
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/models-3d.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add Ridgecrest 3D tomography path integration results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
