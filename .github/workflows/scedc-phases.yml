name: SCEDC Phase Data
on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/fetch_phases.py
      - .github/workflows/scedc-phases.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and parse SCEDC picks
        run: python pipeline/fetch_phases.py
      - name: Commit observed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json
          git diff --cached --quiet || (git commit -m "Add SCEDC observed Ridgecrest phase picks" && git push)
